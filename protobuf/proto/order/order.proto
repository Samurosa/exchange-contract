syntax = "proto3";

package order;

option go_package = "github.com/Samurosa/exchange-contract/protobuf/gen/go/order;order";

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "shared/shared.proto";

service OrderService {

    rpc CreateOrder(CreateOrderRequest)
        returns (CreateOrderResponse);

    rpc GetOrder(GetOrderRequest)
        returns (GetOrderResponse);

    rpc StreamOrderUpdate(StreamOrderUpdateRequest)
        returns (stream StreamOrderUpdateResponse);

    rpc ListOrders(ListOrdersRequest)
        returns (ListOrdersResponse);
}

enum OrderSide {
    ORDER_SIDE_UNSPECIFIED = 0;
    ORDER_SIDE_BUY = 1;
    ORDER_SIDE_SELL = 2;
}

enum OrderStatus {
    ORDER_STATUS_UNSPECIFIED = 0;
    ORDER_STATUS_NEW = 1;
    ORDER_STATUS_OPEN = 2;
    ORDER_STATUS_PARTIALLY_FILLED = 3;
    ORDER_STATUS_FILLED = 4;
    ORDER_STATUS_CANCELED = 5;
    ORDER_STATUS_REJECTED = 6;
}

message Order {

    string order_id = 1;

    string user_id = 2;

    string market_id = 3;

    OrderSide order_side = 4;

    shared.Money price = 5;
    string quantity = 6;
    string filled_quantity = 7;

    OrderStatus order_status = 8;

    google.protobuf.Timestamp created_at = 9;

    google.protobuf.Timestamp updated_at = 10;
}

message CreateOrderRequest {

    string market_id = 1  [
        (validate.rules).string.uuid = true
    ];

    OrderSide order_side = 2 [
        (validate.rules).enum = {
            defined_only: true
        }
    ];

    string idempotency_key = 3[
        (validate.rules).string.uuid = true
    ];

    shared.Money price = 4[
        (validate.rules).message = {
            required: true
        }
    ];

    string quantity = 5 [
        (validate.rules).string = {
            min_len: 1,
            pattern: "^[0-9]+(\\.[0-9]+)?$",
        }    
    ];
}

message CreateOrderResponse {
    string order_id = 1;

     OrderStatus order_status = 2;

     google.protobuf.Timestamp created_at = 3;
}

message GetOrderRequest {
    string order_id = 1 [
        (validate.rules).string.uuid = true
    ];
}

message GetOrderResponse {
    Order order = 1;
}

message StreamOrderUpdateRequest {
    string order_id = 1 [
        (validate.rules).string.uuid = true
    ];

}

message StreamOrderUpdateResponse {
    string order_id = 1;

    OrderStatus order_status = 2;

    string filled_quantity = 3;

    google.protobuf.Timestamp updated_at = 4;
}

message ListOrdersRequest {
    int32 page = 1 [
        (validate.rules).int32 = {
            gte: 1
        }
    ];

    int32 page_size = 2 [
        (validate.rules).int32 = {
            gte: 1,
            lte: 100
        }
    ];

    optional string market_id = 3;
    optional OrderStatus status = 4;
    optional OrderSide side = 5;
}

message ListOrdersResponse {
    repeated Order orders = 1;

    int64 total = 2;

    int32 page = 3;

    int32 page_size = 4;
}