syntax = "proto3";

package shared;

option go_package = "github.com/Samurosa/exchange-contract/protobuf/gen/go/shared;shared";

import "validate/validate.proto";


// Money represents an amount of a specific asset.
//
// The amount is represented as a decimal string to avoid
// floating-point precision issues.
message Money {

  // Asset or currency symbol.
  //
  // Examples: BTC, USDT, ETH.
  string currency = 1 [
    (validate.rules).string = {
      min_len: 1,
      max_len: 5,
      pattern: "^[A-Z]+$"
    }
  ];

  // Decimal amount of the asset.
  //
  // Examples: 0, 0.001, 1.5, 65000.50.
  //
  // The application layer validates whether zero or negative
  // values are allowed for a particular operation.
  string amount = 2 [
    (validate.rules).string = {
      min_len: 1,
      max_len: 20,
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
    }
  ];
}


// Role represents a user's access level within the exchange.
enum Role {

  ROLE_UNSPECIFIED = 0;

  ROLE_USER = 1;

  ROLE_GUEST = 2;

  ROLE_PREMIUM = 3;

  ROLE_ADMIN = 4;
}