syntax = "proto3";

package user;

option go_package = "github.com/Samurosa/exchange-contract/protobuf/gen/go/user;user";

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "shared/shared.proto";

enum Role {

    ROLE_UNSPECIFIED = 0;

    ROLE_USER = 1;
    
    ROLE_GUEST = 2;
    
    ROLE_PREMIUM = 3;

    ROLE_ADMIN = 4;

}

service UserService {
    rpc Registration(RegisterUserRequest)
        returns (RegisterUserResponse);

    rpc GetUser(Empty)
        returns (UserInfoResponse);

    rpc UpdateUserInfo(UpdateUserInfoRequest)
        returns (Empty);

    rpc DeleteUser(Empty)
        returns (Empty);

    rpc ChangePassword(ChangeUserRequest)
        returns (Empty);

    rpc Deposit(DepositRequest)
        returns (DepositResponse);

    rpc Login(LoginRequest)
        returns (TokenPairResponse);

    rpc Logout(LogoutRequest)
        returns (Empty);

    rpc LogoutAllDevices(LogoutAllRequest)
        returns (Empty);

    rpc GetBalances(Empty)
        returns(UserBalancesInfoResponse);
    
    rpc RefreshToken(RefreshTokenRequest)
        returns (TokenPairResponse);
}

message Balance {

    string asset = 1;

    string available = 2;

    string locked = 3;

}

message RegisterUserRequest  {
    string email = 1 [
        (validate.rules).string.email = true
    ];

    string password = 2 [
        (validate.rules).string = {
            min_len: 6,
            max_len: 64,
        }
    ];
    string name = 3 [
    (validate.rules).string = {
            min_len: 2,
            max_len: 64,
        }
    ];
}
message RegisterUserResponse { 
    string user_id = 1;
    google.protobuf.Timestamp created_at = 2;
}

message Empty {}

message UserInfoResponse {
    string user_id = 1;
    string name = 2;
    string email = 3;

    Role role = 5;

    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp updated_at = 7;
}

message UpdateUserInfoRequest{
    optional string name = 1  [
    (validate.rules).string = {
            min_len: 2,
            max_len: 64,
        }
    ];
    optional string email = 2 [
        (validate.rules).string.email = true
    ];
}

message DepositRequest  {
    string user_id = 1[
        (validate.rules).string.uuid = true
    ];

    string asset = 2[
        (validate.rules).string = {
        min_len: 1,
        max_len: 10,
        pattern: "^[A-Z_]+$"
        }
    ];

    shared.Money amount = 3 [
    (validate.rules).message = {
        required: true
    }
];
}

message DepositResponse {
    bool success = 1;
    Balance balance = 2;
}

message LoginRequest{
    string email = 1 [
        (validate.rules).string.email = true
    ];

    string password = 2 [
        (validate.rules).string = {
            min_len: 6,
            max_len: 64,
        }
    ];

    string device_id = 3 [
        (validate.rules).string = {
            min_len: 1,
            max_len: 64,
        }
    ];
}

message TokenPairResponse {
    string access_token = 1;
    string refresh_token = 2;

    google.protobuf.Timestamp access_expires_at = 3;
    google.protobuf.Timestamp access_issued_at = 4;
    google.protobuf.Timestamp refresh_expires_at = 5;
    google.protobuf.Timestamp refresh_issued_at = 6;
}

message UserBalancesInfoResponse{
    repeated Balance balances = 1;
}

message LogoutRequest{
    string refresh_token = 1;
}

message LogoutAllRequest{
    string refresh_token = 1;
}

message RefreshTokenRequest{
    string refresh_token = 1;
}

message ChangeUserRequest {
    string old_password = 1 [
        (validate.rules).string = {
            min_len: 6,
            max_len: 64
        }
    ];
    string new_password = 2 [
        (validate.rules).string = {
            min_len: 6,
            max_len: 64
        }
    ];
}